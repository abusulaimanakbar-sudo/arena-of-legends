name: Build APK (game web -> Android)
on:
  workflow_dispatch:
    inputs:
      game:
        description: 'Folder game (kosong = semua): vario150-sim atau rafli-playstation'
        required: false
        default: ''
  push:
    branches: [ 'claude/vario-150-simulator-game-wfg9rw' ]
    paths: [ '.github/workflows/build-apk.yml', 'rafli-playstation/**', 'rafli-gm/**', 'shared/**', 'vario150-sim/**' ]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { game: rafli-playstation, appid: com.rafli.playstation, appname: 'RAFLI PLAYSTATION', file: RAFLI-PLAYSTATION.apk, orient: sensorLandscape }
          - { game: rafli-gm, appid: com.rafli.gm, appname: 'RAFLI GM', file: RAFLI-GM.apk, orient: fullSensor }
          - { game: vario150-sim, appid: com.rafli.vario150, appname: 'Vario 150 Sim', file: Vario150-Simulator.apk, orient: sensorLandscape }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Siapkan proyek Capacitor
        run: |
          mkdir -p /tmp/app && cd /tmp/app
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 >/dev/null
          mkdir www && cp -r "$GITHUB_WORKSPACE/${{ matrix.game }}/." www/
          rm -f www/README.md www/package.json
          npx cap init "${{ matrix.appname }}" "${{ matrix.appid }}" --web-dir www
          npx cap add android
          npx cap sync android
          sed -i 's/<activity /<activity android:screenOrientation="${{ matrix.orient }}" /' android/app/src/main/AndroidManifest.xml
          # izinkan server relay http (opsional) dan skema https
          node -e "const f='capacitor.config.json';const c=JSON.parse(require('fs').readFileSync(f));c.server={androidScheme:'https',cleartext:true};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          # layar penuh imersif: sembunyikan status bar & navigasi, isi sampai poni/notch
          MAIN=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(grep -m1 '^package' "$MAIN")
          cat > "$MAIN" <<JAVA
          $PKG
          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) { super.onCreate(b); hideBars(); }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
            private void hideBars() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          JAVA
          sed -i 's/^          //' "$MAIN"
          STY=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="windowActionBar">false</item>#<item name="windowActionBar">false</item><item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item><item name="android:statusBarColor">@android:color/transparent</item><item name="android:navigationBarColor">@android:color/transparent</item>#' "$STY"
      - name: Build APK debug
        run: cd /tmp/app/android && ./gradlew assembleDebug --no-daemon
      - name: Ganti nama APK
        run: cp /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk "/tmp/${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-apk
          path: /tmp/${{ matrix.file }}
      - name: Rilis (link unduhan)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK terbaru
          files: /tmp/${{ matrix.file }}
          prerelease: true
