name: Build APK (game web -> Android)
on:
  workflow_dispatch:
    inputs:
      game:
        description: 'Folder game: vario150-sim atau rafli-playstation'
        required: true
        default: 'rafli-playstation'
      appid:
        description: 'Application ID'
        required: true
        default: 'com.rafli.playstation'
      appname:
        description: 'Nama aplikasi'
        required: true
        default: 'RAFLI PLAYSTATION'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Siapkan proyek Capacitor
        run: |
          mkdir -p /tmp/app && cd /tmp/app
          npm init -y >/dev/null
          npm i @capacitor/core @capacitor/cli @capacitor/android >/dev/null
          mkdir www && cp -r "$GITHUB_WORKSPACE/${{ inputs.game }}/." www/
          npx cap init "${{ inputs.appname }}" "${{ inputs.appid }}" --web-dir www
          npx cap add android
          npx cap sync android
          # layar penuh landscape
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - name: Build APK debug
        run: cd /tmp/app/android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game }}-apk
          path: /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk
