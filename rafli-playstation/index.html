<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RAFLI PLAYSTATION — Idle Tycoon 3D</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="gl"></canvas>
<header id="top">
  <div class="brand"><span class="sym">△○✕□</span> RAFLI <b>PLAYSTATION</b></div>
  <div class="stats">
    <div class="chip" id="clock">Hari 1 · 09:00</div>
    <div class="money"><small>Uang</small><b id="money">Rp 0</b></div>
    <div><small>Per detik</small><b id="ips">Rp 0</b></div>
    <div><small>Reputasi</small><b id="rep">★☆☆☆☆</b></div>
    <div><small>Franchise</small><b id="stars">👑 0</b></div>
  </div>
  <div class="btns"><button id="btnHH">⚡ Happy Hour</button><button id="btnMus" title="Musik">🎵</button><button id="btnSfx" title="Efek suara">🔊</button></div>
</header>
<aside id="quests"></aside>
<div id="banner"></div>
<div id="tut" class="hidden"></div>
<div id="toast"></div>
<section id="shop">
  <div class="tabs" id="tabs"></div>
  <div id="cards"></div>
</section>
<div id="welcome" class="hidden"><div class="box"><h2>Selamat datang kembali!</h2><p id="welcomeTxt"></p><button id="welcomeOk">Ambil</button></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
