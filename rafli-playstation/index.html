<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RAFLI PLAYSTATION — Idle Tycoon 3D</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="gl"></canvas>
<header id="top">
  <div class="brand"><span class="sym">△○✕□</span> RAFLI <b>PLAYSTATION</b></div>
  <div class="stats">
    <div class="money"><small>Uang</small><b id="money">Rp 0</b></div>
    <div><small>Per detik</small><b id="ips">Rp 0</b></div>
    <div><small>Reputasi</small><b id="rep">★☆☆☆☆</b></div>
    <button id="btnSnd" title="Suara">🔊</button>
  </div>
</header>
<button id="collect" class="hidden">💰 Ambil semua</button>
<div id="toast"></div>
<section id="shop">
  <div class="tabs" id="tabs"></div>
  <div class="cards" id="cards"></div>
</section>
<div id="hint">Seret = putar kamera · Scroll = zoom · Tap koin 💰 untuk ambil uang</div>
<div id="welcome" class="hidden"><div class="box"><h2>Selamat datang kembali!</h2><p id="welcomeTxt"></p><button id="welcomeOk">Ambil</button></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
